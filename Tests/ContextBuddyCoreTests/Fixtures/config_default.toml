[thresholds]
confidence_attention = 4
atomicity_attention = 4
drift_attention = 6
pollution_attention = 7
celebrate_consecutive_n = 5
loop_edits_in_window = 3
loop_window_turns = 3
context_pressure_pct = 85

[grader]
# backend selects which inference runtime grades each turn (issue #3).
# "anthropic" (default) requires ANTHROPIC_API_KEY and uses claude --bare.
# "ollama" and "openai_compatible" run locally via curl, no API key needed.
backend = "anthropic"
model = "claude-haiku-4-5-20251001"
sliding_window_turns = 3
inspect_model = "claude-sonnet-4-6"

# Used when backend = "ollama". Pull a recommended model first:
#   ollama pull qwen2.5:14b-instruct
# Then set [grader].model = "qwen2.5:14b-instruct" above.
[grader.ollama]
endpoint = "http://localhost:11434"

# Used when backend = "openai_compatible" (LM Studio, llama.cpp server,
# vLLM, hosted OpenAI-compatible gateways, etc.). api_key_env is the *name*
# of an environment variable to read the bearer token from; leave empty
# for unauthenticated local servers.
[grader.openai_compatible]
endpoint = "http://localhost:1234/v1"
api_key_env = ""

# Used when backend = "typesafe" (TypeSafe Jev via plugin/grader/jev.mjs).
# api_key_env is the *name* of the environment variable holding the key
# (never the key). task_gate: is_task probability below which the turn is
# not graded. harm_action: destructive/bypass probability treated as
# actionable. TYPESAFE_BASE_URL in the environment overrides endpoint.
[grader.typesafe]
api_key_env = "TYPESAFE_API_KEY"
endpoint = "https://api.typesafe.ai"
task_gate = 0.5
harm_action = 0.7

[ui]
animations_enabled = true
token_row_pct = 70
